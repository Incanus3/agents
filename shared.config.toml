personality = "pragmatic"
model = "gpt-6-sol"
model_reasoning_effort = "high"
approvals_reviewer = "auto_review"
service_tier = "default"
suppress_unstable_features_warning = true
# Temporary workaround for https://github.com/openai/codex/issues/34024.
# The referenced catalog differs from the live catalog only by marking Luna as multi-agent V2.
# Regenerate the catalog after Codex upgrades because it is a static startup snapshot.
# model_catalog_json = "/home/jakub/.agents/model-catalog-v2.json"

[features]
prevent_idle_sleep = true
default_mode_request_user_input = true
context_management.experimental_mode = true

[agents]
default_subagent_model = "gpt-6-sol"
default_subagent_reasoning_effort = "medium"

[tui]
status_line = ["model-with-reasoning", "git-branch", "branch-changes", "run-state", "context-used", "five-hour-limit", "weekly-limit", "total-input-tokens", "total-output-tokens", "task-progress"]
status_line_use_colors = true
